# Local test environment for jhu-repository-mcp. See dev/README.md.
#
# Two mutually exclusive profiles (pick one; both publish the MCP on :3000):
#
#   docker compose --profile mock up --build   # canned fixtures, ready in seconds
#   docker compose --profile real up --build   # DSpace + Dataverse + their Solr/Postgres
#
# The real stack is empty until you load records (dev/README.md). The MCP
# validates the Solr schemas ONCE at startup, so it waits on the Solr healthchecks.
#
# The real profile runs ONE SolrCloud (a ZooKeeper plus a Solr node) that serves
# both repositories, as the JHU deployment does: DSpace's `search` collection
# (JScholarship) and Dataverse's `collection1` (JHRDR). A one-shot `solr-init`
# job uploads each platform's configset and creates the collections.
#
# Host ports (override with env): MCP 3000, DSpace API 8080, Dataverse 8081,
# SolrCloud 8983.

name: jhu-repository-mcp

x-mcp-common: &mcp-common
  image: jhu-repository-mcp:local
  build:
    context: .
    args:
      BUILD_VERSION: local
      BUILD_COMMIT: local
  ports:
    - "${MCP_PORT:-3000}:3000"
  restart: unless-stopped

services:
  # ─── Mock profile ──────────────────────────────────────────────────────────

  mock-backend:
    profiles: [mock]
    image: oven/bun:1.3.11
    working_dir: /app
    command: ["bun", "dev/mock-backend/server.ts"]
    environment:
      PORT: "8090"
    volumes:
      - ./dev/mock-backend:/app/dev/mock-backend:ro
      - ./test/fixtures:/app/test/fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO-  >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-mock:
    <<: *mcp-common
    profiles: [mock]
    depends_on:
      mock-backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: stage
      BUILD_VERSION: local
      BUILD_COMMIT: local
      ALLOWED_HOSTS: localhost:3000
      JSCHOLARSHIP_SOLR_URL: http://mock-backend:8090/jscholarship/solr/search
      JSCHOLARSHIP_API_URL: http://mock-backend:8090/jscholarship/server/api
      JSCHOLARSHIP_PUBLIC_URL: https://jscholarship.library.jhu.edu
      JHRDR_SOLR_URL: http://mock-backend:8090/jhrdr/solr/collection1
      JHRDR_API_URL: http://mock-backend:8090/jhrdr/api
      JHRDR_PUBLIC_URL: https://archive.data.jhu.edu

  # ─── Real profile: one SolrCloud for both repositories ─────────────────────
  # Solr 9 must serve DSpace and Dataverse at once, so DSPACE_TAG defaults to a
  # DSpace release built for Solr 9 (dspace-9_x). DSpace 8 targets Solr 8.11 and
  # cannot share this node.

  zookeeper:
    profiles: [real]
    image: zookeeper:${ZOOKEEPER_TAG:-3.9}
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Each platform ships its Solr configset in its own image; copy them into a
  # shared volume so solr-init can upload them to ZooKeeper.
  dspace-configsets:
    profiles: [real]
    image: dspace/dspace-solr:${DSPACE_TAG:-dspace-9_x}
    restart: "no"
    user: root
    entrypoint: ["sh", "-c", "cp -a /opt/solr/server/solr/configsets/. /configsets/"]
    volumes:
      - solr_configsets:/configsets

  dataverse-configset:
    profiles: [real]
    image: gdcc/configbaker:${DATAVERSE_TAG:-6.10.1}
    restart: "no"
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /configsets/dataverse && cp -a /template/. /configsets/dataverse/"]
    volumes:
      - solr_configsets:/configsets

  solr:
    profiles: [real]
    image: solr:${SOLR_TAG:-9.8.0}
    depends_on:
      zookeeper:
        condition: service_healthy
    command: ["solr-foreground", "-c", "-z", "zookeeper:2181"]
    ports:
      - "${SOLR_PORT:-8983}:8983"
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8983/solr/admin/collections?action=LIST >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Idempotent: uploads the configsets and creates any collection that is
  # missing (single shard, single replica).
  solr-init:
    profiles: [real]
    image: solr:${SOLR_TAG:-9.8.0}
    restart: "no"
    depends_on:
      solr:
        condition: service_healthy
      dspace-configsets:
        condition: service_completed_successfully
      dataverse-configset:
        condition: service_completed_successfully
    volumes:
      - solr_configsets:/configsets:ro
    entrypoint:
      - /bin/bash
      - "-c"
      - |
        set -eu
        api=http://solr:8983/solr/admin/collections
        for cs in authority oai search statistics dataverse; do
          solr zk upconfig -z zookeeper:2181 -n $$cs -d /configsets/$$cs
        done
        existing=$$(wget -qO- "$$api?action=LIST&wt=json")
        create() {
          case "$$existing" in
            *"\"$$1\""*) echo "collection $$1 already exists" ;;
            *) wget -qO- "$$api?action=CREATE&name=$$1&collection.configName=$$2&numShards=1&replicationFactor=1&wt=json" >/dev/null
               echo "created collection $$1" ;;
          esac
        }
        for c in authority oai search statistics; do create $$c $$c; done
        create collection1 dataverse

  # ─── Real profile: DSpace (JScholarship) ───────────────────────────────────
  # Backend only (no Angular UI). Uses the shared SolrCloud above instead of the
  # standalone Solr in the DSpace project's own docker-compose.yml.

  dspacedb:
    profiles: [real]
    image: dspace/dspace-postgres-pgcrypto:${DSPACE_TAG:-dspace-9_x}
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: dspace
    volumes:
      - dspace_pgdata:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  dspace:
    profiles: [real]
    image: dspace/dspace:${DSPACE_TAG:-dspace-9_x}
    depends_on:
      dspacedb:
        condition: service_healthy
      solr-init:
        condition: service_completed_successfully
    ports:
      - "${DSPACE_PORT:-8080}:8080"
    environment:
      dspace__P__dir: /dspace
      dspace__P__server__P__url: http://localhost:${DSPACE_PORT:-8080}/server
      dspace__P__ui__P__url: http://localhost:4000
      dspace__P__name: DSpace local test
      solr__P__server: http://solr:8983/solr
      db__P__url: jdbc:postgresql://dspacedb:5432/dspace
      LOGGING_CONFIG: /dspace/config/log4j2-container.xml
    entrypoint:
      - /bin/bash
      - "-c"
      - |
        /dspace/bin/dspace database migrate ignored
        exec catalina.sh run
    volumes:
      - dspace_assetstore:/dspace/assetstore
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/server/api >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # ─── Real profile: Dataverse (JHRDR) ───────────────────────────────────────
  # Follows the Dataverse project's container (gdcc) layout: the configbaker
  # image supplies the Solr configset and bootstraps the installation.
  # DATAVERSE_TAG should match the version being tested.

  dataverse-db:
    profiles: [real]
    image: postgres:17
    environment:
      POSTGRES_USER: dataverse
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dataverse
    volumes:
      - dataverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  dataverse:
    profiles: [real]
    image: gdcc/dataverse:${DATAVERSE_TAG:-6.10.1}
    depends_on:
      dataverse-db:
        condition: service_healthy
      solr-init:
        condition: service_completed_successfully
    ports:
      - "${DATAVERSE_PORT:-8081}:8080"
    environment:
      DATAVERSE_DB_HOST: dataverse-db
      DATAVERSE_DB_USER: dataverse
      DATAVERSE_DB_PASSWORD: secret
      DATAVERSE_DB_NAME: dataverse
      DATAVERSE_SOLR_HOST: solr
      DATAVERSE_SOLR_PORT: "8983"
      DATAVERSE_SOLR_CORE: collection1
      DATAVERSE_URL: http://localhost:${DATAVERSE_PORT:-8081}
      DATAVERSE_FQDN: localhost
    volumes:
      - dataverse_data:/dv
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/info/version >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  dataverse-bootstrap:
    profiles: [real]
    image: gdcc/configbaker:${DATAVERSE_TAG:-6.10.1}
    restart: "no"
    depends_on:
      dataverse:
        condition: service_healthy
    command: ["bootstrap.sh", "dev"]
    environment:
      DATAVERSE_URL: http://dataverse:8080
      TIMEOUT: 10m

  # ─── Real profile: the MCP server ──────────────────────────────────────────
  # Waits for solr-init: Solr schema validation runs once at startup.

  mcp-real:
    <<: *mcp-common
    profiles: [real]
    depends_on:
      solr-init:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: stage
      BUILD_VERSION: local
      BUILD_COMMIT: local
      ALLOWED_HOSTS: localhost:3000
      JSCHOLARSHIP_SOLR_URL: http://solr:8983/solr/search
      JSCHOLARSHIP_API_URL: http://dspace:8080/server/api
      JSCHOLARSHIP_PUBLIC_URL: ${JSCHOLARSHIP_PUBLIC_URL:-http://localhost:4000}
      JHRDR_SOLR_URL: http://solr:8983/solr/collection1
      JHRDR_API_URL: http://dataverse:8080/api
      JHRDR_PUBLIC_URL: ${JHRDR_PUBLIC_URL:-http://localhost:8081}

volumes:
  dspace_pgdata:
  dspace_assetstore:
  dataverse_pgdata:
  dataverse_data:
  zookeeper_data:
  zookeeper_datalog:
  solr_data:
  solr_configsets:
