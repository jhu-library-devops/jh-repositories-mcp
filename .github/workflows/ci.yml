name: CI

on:
  push:
    branches: [main]
  # Run validation on every pull request regardless of its base branch, so
  # stacked PRs (whose base is another feature branch, not `main`) are also
  # validated. GitHub checks out the PR's merge ref (head merged into its
  # base), so a lower PR in a stack is validated together with the parent
  # branch it targets, giving a meaningful signal even though the branch would
  # not build in isolation against `main`. Deploy stays gated on `main` only
  # (see build-push.yml / deploy.yml).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Set up terraform-docs
        uses: ./.github/actions/setup-terraform-docs

      # Markdown style, links, cited paths, public-content guard, and whether
      # the generated reference in docs/reference/ matches the code.
      - name: Documentation
        run: bun run docs:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun pm untrusted
